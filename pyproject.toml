[project]
name = "ink-tokenizer"
version = "0.1.0"
description = "Structural autocomplete for handwritten engineering work"
readme = "README.md"
# Upper bound tracks InkSight's own (>=3.11,<3.14). The lower bound stays at
# 3.11 so a stock lab machine (Ubuntu 24.04 ships 3.12) works out of the box.
requires-python = ">=3.11,<3.14"
dependencies = [
    "pillow>=10.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# Everything needed to run the model in-process. The markers matter: both
# wheels exist for Linux and macOS-arm64 but NOT for Windows, so on Windows
# this extra resolves to nothing instead of failing to install.
inference = [
    "tensorflow==2.20.0 ; sys_platform != 'win32'",
    "tensorflow-text==2.20.1 ; sys_platform != 'win32'",
    "huggingface-hub>=0.27.0",
]
# Extra deps for running the HTTP service (implies `inference`).
service = [
    "ink-tokenizer[inference]",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
ink-tokenizer = "ink_tokenizer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ink_tokenizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
